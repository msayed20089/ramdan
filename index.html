<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodafone Card Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --dark: #343a40;
            --light: #f8f9fa;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .status-bar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .time-info {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .time-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            font-size: 1.1em;
            background: #f0f2f5;
            padding: 8px 15px;
            border-radius: 50px;
        }

        .time-item i {
            color: var(--primary);
            font-size: 1.2em;
        }

        .countdown-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }

        .countdown-box span {
            font-size: 1.3em;
            margin: 0 5px;
            color: #ffd700;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .stat-icon {
            font-size: 2.5em;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--dark);
        }

        .stat-label {
            color: #6c757d;
            margin-top: 5px;
        }

        .cards-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            max-height: 500px;
            overflow-y: auto;
        }

        .cards-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .cards-title {
            font-size: 1.3em;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-item {
            background: #f8f9fa;
            border-right: 5px solid var(--primary);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: all 0.3s;
        }

        .card-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card-number-badge {
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1em;
        }

        .card-info {
            flex: 1;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card-detail {
            background: white;
            padding: 8px 20px;
            border-radius: 50px;
            color: #555;
            font-size: 1.1em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-detail i {
            color: var(--primary);
        }

        .no-cards {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-cards i {
            font-size: 4em;
            margin-bottom: 15px;
            color: #ddd;
        }

        .loading {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: white;
            opacity: 0.8;
        }

        /* تنسيق شريط التمرير */
        .cards-container::-webkit-scrollbar {
            width: 8px;
        }

        .cards-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>★ Vodafone Card Viewer ★</h1>
            <p>نظام عرض كروت فودافون المباشر</p>
        </div>

        <div id="alertContainer"></div>

        <div class="status-bar">
            <div class="time-info">
                <div class="time-item">
                    <i>🕐</i>
                    <span id="currentTime">--:--:--</span>
                </div>
                <div class="time-item">
                    <i>🔄</i>
                    <span>آخر تحديث: <span id="lastUpdate">لم يتم</span></span>
                </div>
            </div>
            
            <div class="countdown-box">
                <i>⏳</i>
                التحديث بعد <span id="countdown">5</span>ث
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="manualRefresh()">
                    <i>🔄</i>
                    تحديث يدوي
                </button>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalCards">0</div>
                <div class="stat-label">إجمالي الكروت</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="totalAmount">0</div>
                <div class="stat-label">إجمالي القيمة</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-value" id="totalUnits">0</div>
                <div class="stat-label">إجمالي الوحدات</div>
            </div>
        </div>

        <div class="cards-container" id="cardsContainer">
            <div class="cards-header">
                <div class="cards-title">
                    <i>💳</i>
                    قائمة الكروت المتاحة
                </div>
                <span class="badge" id="cardsCount">0</span>
            </div>
            <div class="no-cards">
                <i>📱</i>
                <h3>جاري تحميل الكروت...</h3>
                <div class="loading" style="margin: 20px auto;"></div>
            </div>
        </div>

        <div class="footer">
            <p>بيتحدث تلقائياً كل 5 ثواني</p>
        </div>
    </div>

    <script>
        // بيانات الكروت (هتتغير من API)
        let cardsData = [];
        let countdown = 5;
        let updateInterval;

        // دالة تنسيق رقم الكارت
        function formatCardNumber(card) {
            if (!card) return '';
            return card.replace(/(\d{4})/g, '$1 ').trim();
        }

        // دالة حساب الإحصائيات
        function calculateStats(cards) {
            let totalAmount = 0;
            let totalUnits = 0;
            
            cards.forEach(card => {
                totalAmount += parseFloat(card.amount) || 0;
                totalUnits += parseFloat(card.units) || 0;
            });
            
            return { totalAmount, totalUnits };
        }

        // دالة عرض الكروت
        function displayCards() {
            const container = document.getElementById('cardsContainer');
            const stats = calculateStats(cardsData);
            
            document.getElementById('totalCards').textContent = cardsData.length;
            document.getElementById('totalAmount').textContent = stats.totalAmount.toFixed(2);
            document.getElementById('totalUnits').textContent = stats.totalUnits.toFixed(0);
            document.getElementById('cardsCount').textContent = cardsData.length;
            
            if (!cardsData || cardsData.length === 0) {
                container.innerHTML = `
                    <div class="cards-header">
                        <div class="cards-title">
                            <i>💳</i>
                            قائمة الكروت المتاحة
                        </div>
                        <span class="badge">0</span>
                    </div>
                    <div class="no-cards">
                        <i>📭</i>
                        <h3>لا توجد كروت متاحة</h3>
                        <p>انتظر التحديث التالي</p>
                    </div>
                `;
                return;
            }

            let cardsHtml = `
                <div class="cards-header">
                    <div class="cards-title">
                        <i>💳</i>
                        قائمة الكروت المتاحة
                    </div>
                    <span class="badge">${cardsData.length}</span>
                </div>
            `;
            
            cardsData.forEach(card => {
                cardsHtml += `
                    <div class="card-item">
                        <div class="card-number-badge">#${card.number}</div>
                        <div class="card-info">
                            <div class="card-detail">
                                <i>💳</i>
                                ${formatCardNumber(card.card)}
                            </div>
                            <div class="card-detail">
                                <i>📦</i>
                                ${card.units} وحدة
                            </div>
                            <div class="card-detail">
                                <i>💰</i>
                                ${card.amount} جنيه
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = cardsHtml;
        }

        // دالة عرض التنبيهات
        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            const icons = {
                success: '✅',
                danger: '❌',
                warning: '⚠️'
            };
            
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    <i>${icons[type]}</i>
                    ${message}
                </div>
            `;
            
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 3000);
        }

        // دالة التحديث اليدوي
        function manualRefresh() {
            showAlert('جاري تحديث البيانات...', 'warning');
            fetchCards();
        }

        // دالة جلب الكروت
        function fetchCards() {
            // هنا هنستخدم localStorage أو API خارجي
            // مؤقتاً هنستخدم بيانات تجريبية
            const demoData = [
                { number: 1, card: '01012345678', units: '50', amount: '100' },
                { number: 2, card: '01187654321', units: '30', amount: '60' },
                { number: 3, card: '01234567890', units: '100', amount: '200' }
            ];
            
            cardsData = demoData;
            displayCards();
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ar-EG');
            showAlert('تم تحديث البيانات بنجاح');
        }

        // دالة تحديث العداد
        function updateCountdown() {
            countdown--;
            document.getElementById('countdown').textContent = countdown;
            
            if (countdown <= 0) {
                countdown = 5;
                fetchCards();
            }
        }

        // دالة تحديث الوقت
        function updateCurrentTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-EG');
            document.getElementById('currentTime').textContent = timeString;
        }

        // بدء التحديثات
        fetchCards(); // جلب أولي للبيانات
        setInterval(updateCountdown, 1000); // تحديث العداد كل ثانية
        setInterval(updateCurrentTime, 1000); // تحديث الوقت كل ثانية
    </script>
</body>
</html>
