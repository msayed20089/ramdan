<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodafone Card Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .status-bar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .time-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .time-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
            font-size: 1.1em;
        }

        .time-item i {
            color: #667eea;
            font-size: 1.2em;
        }

        .countdown-box {
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            color: #333;
        }

        .countdown-box span {
            color: #dc3545;
            font-size: 1.3em;
            margin: 0 5px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.4);
        }

        .cards-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-height: 500px;
            overflow-y: auto;
        }

        .card-item {
            background: #f8f9fa;
            border-right: 5px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: all 0.3s;
        }

        .card-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .card-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            min-width: 60px;
        }

        .card-details {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .detail {
            background: white;
            padding: 5px 15px;
            border-radius: 50px;
            color: #666;
            font-size: 1.1em;
        }

        .detail i {
            color: #667eea;
            margin-left: 8px;
        }

        .no-cards {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .no-cards i {
            font-size: 3em;
            margin-bottom: 10px;
            color: #ddd;
        }

        .total-badge {
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9em;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>★ Vodafone Card Viewer ★</h1>
            <p>عرض كروت فودافون مباشر</p>
        </div>

        <div class="status-bar">
            <div class="time-info">
                <div class="time-item">
                    <i>🕐</i>
                    <span id="currentTime">--:--:--</span>
                </div>
                <div class="time-item">
                    <i>🔄</i>
                    <span>آخر تحديث: <span id="lastUpdate">لم يتم</span></span>
                </div>
                <div class="time-item">
                    <i>📊</i>
                    <span>إجمالي: <span id="totalCards">0</span></span>
                </div>
            </div>
            
            <div class="countdown-box">
                <i>⏳</i>
                التحديث التالي بعد <span id="countdown">5</span> ثانية
            </div>

            <button class="refresh-btn" onclick="refreshToken()">
                <i>🔄</i>
                تحديث التوكن
            </button>
        </div>

        <div id="errorContainer" style="display: none;" class="error-message"></div>

        <div class="cards-container" id="cardsContainer">
            <div class="no-cards">
                <i>📱</i>
                <h3>جاري تحميل الكروت...</h3>
                <div class="loading" style="margin: 20px auto;"></div>
            </div>
        </div>
    </div>

    <script>
        let countdown = 5;
        let updateInterval;

        function formatCardNumber(card) {
            return card.replace(/(\d{4})/g, '$1 ').trim();
        }

        function displayCards(cards) {
            const container = document.getElementById('cardsContainer');
            
            if (!cards || cards.length === 0) {
                container.innerHTML = `
                    <div class="no-cards">
                        <i>📭</i>
                        <h3>لا توجد كروت متاحة</h3>
                        <p>انتظر التحديث التالي</p>
                    </div>
                `;
                return;
            }

            let html = '';
            cards.forEach(card => {
                html += `
                    <div class="card-item">
                        <div class="card-number">#${card.number}</div>
                        <div class="card-details">
                            <div class="detail">
                                <i>💳</i>
                                ${formatCardNumber(card.card)}
                            </div>
                            <div class="detail">
                                <i>📦</i>
                                الوحدات: ${card.units}
                            </div>
                            <div class="detail">
                                <i>💰</i>
                                القيمة: ${card.amount}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function fetchCards() {
            try {
                const response = await fetch('/api/cards');
                const data = await response.json();
                
                if (data.success) {
                    displayCards(data.data);
                    document.getElementById('lastUpdate').textContent = data.last_update;
                    document.getElementById('totalCards').textContent = data.total;
                    
                    // إخفاء رسالة الخطأ
                    document.getElementById('errorContainer').style.display = 'none';
                }
            } catch (error) {
                console.error('خطأ في جلب الكروت:', error);
                document.getElementById('errorContainer').innerHTML = `
                    <i>⚠️</i>
                    خطأ في الاتصال بالخادم
                `;
                document.getElementById('errorContainer').style.display = 'block';
            }
        }

        async function refreshToken() {
            try {
                const response = await fetch('/api/refresh');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('errorContainer').innerHTML = `
                        <i>✅</i>
                        ${data.message}
                    `;
                    document.getElementById('errorContainer').style.display = 'block';
                    document.getElementById('errorContainer').style.background = '#d4edda';
                    document.getElementById('errorContainer').style.color = '#155724';
                    document.getElementById('errorContainer').style.borderColor = '#c3e6cb';
                    
                    setTimeout(() => {
                        document.getElementById('errorContainer').style.display = 'none';
                    }, 3000);
                }
            } catch (error) {
                console.error('خطأ في تحديث التوكن:', error);
            }
        }

        function updateCountdown() {
            countdown--;
            document.getElementById('countdown').textContent = countdown;
            
            if (countdown <= 0) {
                countdown = 5;
                fetchCards();
            }
        }

        function updateCurrentTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-EG');
            document.getElementById('currentTime').textContent = timeString;
        }

        // بدء التحديثات
        fetchCards(); // جلب فوري للكروت
        setInterval(updateCountdown, 1000); // تحديث العداد كل ثانية
        setInterval(updateCurrentTime, 1000); // تحديث الوقت كل ثانية
    </script>
</body>
</html>
